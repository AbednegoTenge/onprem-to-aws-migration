{% extends "base.html" %}
{% block title %}New order{% endblock %}
{% block content %}
<h1>New order</h1>
<form method="post" action="{{ url_for('order_create') }}">
  <label>Customer
    <select name="customer_id" required>
      <option value="">Choose…</option>
      {% for c in customers %}<option value="{{ c.id }}">#{{ c.id }} {{ c.full_name }} ({{ c.email }})</option>{% endfor %}
    </select>
  </label>
  <table>
    <tr><th>SKU</th><th>Product</th><th class="num">Price</th><th class="num">In stock</th><th>Qty</th></tr>
    {% for p in products %}
    <tr><td><code>{{ p.sku }}</code></td><td>{{ p.name }}</td><td class="num">${{ "{:,.2f}".format(p.price) }}</td>
        <td class="num">{{ p.stock }}</td>
        <td><input class="qty" type="number" name="qty_{{ p.id }}" min="0" max="{{ p.stock }}" placeholder="0"></td></tr>
    {% endfor %}
  </table>
  <button>Place order</button>
</form>
{% endblock %}
